ROC_PREFAB
{
    prefabName        = myRockTower
    modelName         = RockTower
    model             = Outcrop/RockTower_LOD0

    // Auto   - use .mu colliders if present, else build a MeshCollider
    colliderMode      = Auto

    // Name of the child transform to take the collider mesh from.
    // Leave blank to auto-pick the highest-detail mesh. Only set this if you
    // have confirmed the transform name inside the .mu.
    // colliderTransform =

    // Omit `shader` to borrow the one stock ROC prefabs use.
    MATERIAL
    {
        // shader   = KSP/Bumped Specular
        mainTex     = Outcrop/RockTower_Tex
        bumpMap     = Outcrop/RockTower_nrm
        specColor   = 0.15, 0.15, 0.15, 1
        shininess   = 0.08
    }

    autoScanPoints = 8      // per ring, 0 = off
    autoScanRings  = 3
    autoScanLow    = 0.25   // fraction of mesh height
    autoScanHigh   = 0.75
    autoScanInset  = 1.0    // radius multiplier

    colliderConvex    = false
    layer             = Local Scenery
}

ROC_DEFINITION
{
    Mod                  = Outcrop
    Type                 = KerbinRockTower
    displayName          = Rock Tower
    prefabName           = myRockTower
    modelName            = RockTower
    OrientateUp          = true
    Depth                = 0.55
    CanBeTaken           = false
    Frequency            = 20
    CastShadows          = true
    ReceiveShadows       = true
    CollisionThreshold   = 8
    SmallROC             = false
    RandomDepth          = false
    RandomOrientation    = true
    RandomRotation       = false
    Scale                = 1
    CELESTIALBODY
    {
        Name  = Kerbin
        Biome = Shores
    }
}

// ---------------------------------------------------------------------------
// 3. Science. ROC.PerformExperiment builds the id as:
//        mse.experimentID + "_" + ROC.type
//    Stock arms carry experimentID = ROCScience, and Type is KerbinRockTower
//    So the final id is ROCScience_KerbinRockTower
// ---------------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
    id                     = ROCScience_KerbinRockTower
    title                  = Rock Tower Analysis
    baseValue              = 45
    scienceCap             = 45
    dataScale              = 1
    requireAtmosphere      = False
    situationMask          = 1
    biomeMask              = 0
    RESULTS
    {
        default   = The tower is made of rock, and it is very sturdy.
        KerbinSrf = The tower is made of rock, and it is very sturdy.
    }
}